name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  engine:
    name: engine crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check whitespace
        run: git diff --check
      - name: Clippy
        run: cargo clippy --workspace --exclude sandbox --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Doc tests
        run: cargo test --doc
      - name: Destruction benchmark is unchanged
        run: cargo run -q -p engine_stress --bin destruction_bench -- --check
      - name: Destruction replay is unchanged
        run: cargo run -q -p engine_stress --bin destruction_replay -- --check
      - name: Fragment distribution baseline is unchanged
        run: cargo run -q -p engine_stress --bin fragment_distribution_bench -- --check
      - name: Static fracture distribution probe
        # Measurement-only: proves the unchanged static path is deterministic
        # and prints its distribution before any policy is wired into it.
        run: cargo run -q -p engine_stress --bin fragment_distribution_bench -- --probe-static
      - name: Fracture locality remains bounded
        run: cargo run -q -p engine_stress --bin fracture_locality_bench
      - name: Stress baseline is unchanged
        # Deterministic counters only. Timings are diagnostic and are never
        # asserted, so this cannot fail because a runner was slow.
        run: cargo run --release -p engine_stress --bin stress -- --check
      - name: Structural baseline is unchanged
        # Kept separate from the geometry baseline so a destruction change and a
        # meshing change never land in one diff.
        run: cargo run --release -p engine_stress --bin structural -- --check
      - name: Fixtures are still canonical
        # Regenerating must be a no-op; a diff here means the save format moved
        # without the committed fixtures being reviewed.
        run: |
          cargo run -p engine_io --example make_fixtures
          git diff --exit-code -- fixtures/
      - name: DROP 0005 mechanics chaos is deterministic
        # Extend the existing DROP 4 chaos harness; never replace it. First prove
        # the accepted 0004.9 report stayed byte-identical, then prove two fresh
        # DROP 5 mechanics/fantasy abuse runs are byte-identical to each other.
        run: |
          set -euo pipefail
          cargo run -q -p engine_stress --bin chaos4 -- /tmp/drop4-chaos.json
          cmp -s /tmp/drop4-chaos.json docs/diagnostics/drop0004_9_chaos/report.json
          cargo run -q -p engine_stress --bin chaos4 -- --drop5 /tmp/drop5-chaos-a.json
          cargo run -q -p engine_stress --bin chaos4 -- --drop5 /tmp/drop5-chaos-b.json
          cmp -s /tmp/drop5-chaos-a.json /tmp/drop5-chaos-b.json
          cat /tmp/drop5-chaos-a.json

  sandbox:
    name: sandbox app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Bevy's system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-0 mesa-vulkan-drivers xvfb
      - name: Clippy
        run: cargo clippy -p sandbox --all-targets
      - name: Test
        run: cargo test -p sandbox
      - name: Contact replay is fixed-step deterministic
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p sandbox
          Xvfb :99 -screen 0 1280x720x24 >/tmp/micrology-xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          export DISPLAY=:99
          # Xvfb is asynchronous. Starting the sandbox immediately after the
          # process spawn races Winit against X server startup on a cold runner.
          # Wait for the X11 socket rather than turning that race into a false
          # destruction-determinism failure.
          x_ready=0
          for _ in $(seq 1 100); do
            if [ -S /tmp/.X11-unix/X99 ] && kill -0 "$xvfb_pid" 2>/dev/null; then
              x_ready=1
              break
            fi
            sleep 0.1
          done
          if [ "$x_ready" -ne 1 ]; then
            cat /tmp/micrology-xvfb.log
            echo "Xvfb did not become ready" >&2
            exit 1
          fi
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_ICD_FILENAMES"
          mkdir -p target/replay-determinism
          for run in 1 2 3; do
            rm -rf target/diagnostics/destruction_lab
            MICROLOGY_REPLAY_SCRIPT="$PWD/fixtures/destruction/replay-contact-volley.json" \
            MICROLOGY_REPLAY_CAPTURE=1 \
              ./target/debug/sandbox >"/tmp/micrology-replay-$run.log" 2>&1 &
            sandbox_pid=$!
            complete=0
            for _ in $(seq 1 900); do
              if compgen -G 'target/diagnostics/destruction_lab/volley_damage_off-tick*.json' >/dev/null; then
                complete=1
                break
              fi
              if ! kill -0 "$sandbox_pid" 2>/dev/null; then
                cat "/tmp/micrology-replay-$run.log"
                echo "sandbox exited before replay completion" >&2
                exit 1
              fi
              sleep 0.1
            done
            if [ "$complete" -ne 1 ]; then
              cat "/tmp/micrology-replay-$run.log"
              kill "$sandbox_pid" 2>/dev/null || true
              wait "$sandbox_pid" 2>/dev/null || true
              echo "contact replay did not complete within 90 seconds" >&2
              exit 1
            fi
            mkdir -p "target/replay-determinism/run$run"
            cp target/diagnostics/destruction_lab/*.json "target/replay-determinism/run$run/"
            kill "$sandbox_pid" 2>/dev/null || true
            wait "$sandbox_pid" 2>/dev/null || true
          done
          python3 tools/verify-contact-replay-determinism.py \
            target/replay-determinism/run1 \
            target/replay-determinism/run2 \
            target/replay-determinism/run3
