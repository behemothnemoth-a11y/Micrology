name: Micrology Fresh Current-Build Video

on:
  push:
    branches:
      - chatgpt/micrology-fresh-video-2026-10-03

permissions:
  contents: write

jobs:
  capture-and-render:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install sandbox and capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-0 mesa-vulkan-drivers xvfb ffmpeg fonts-dejavu-core

      - name: Build current sandbox
        run: cargo build -p sandbox

      - name: Capture fresh current-build footage and render progress video
        shell: bash
        run: |
          set -euo pipefail

          OUTDIR="docs/diagnostics/fresh_progress_video_2026_10_03"
          WORK="${RUNNER_TEMP}/micrology-fresh-video"
          mkdir -p "$OUTDIR" "$WORK"

          FONT="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          test -f "$FONT"

          Xvfb :99 -screen 0 1280x720x24 >"$WORK/xvfb.log" 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          export DISPLAY=:99

          ready=0
          for _ in $(seq 1 100); do
            if [ -S /tmp/.X11-unix/X99 ] && kill -0 "$xvfb_pid" 2>/dev/null; then
              ready=1
              break
            fi
            sleep 0.1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$WORK/xvfb.log"
            exit 1
          fi

          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_ICD_FILENAMES"

          capture_demo() {
            local name="$1"
            local env_name="$2"
            local max_seconds="$3"

            echo "=== fresh capture: $name ==="
            rm -f "$WORK/$name-raw.mp4" "$WORK/$name.log"

            ffmpeg -hide_banner -loglevel error -y \
              -f x11grab -draw_mouse 0 -framerate 30 -video_size 1280x720 \
              -i :99.0 \
              -an -c:v libx264 -preset veryfast -crf 18 -pix_fmt yuv420p \
              -t "$max_seconds" "$WORK/$name-raw.mp4" &
            recorder_pid=$!

            sleep 0.5
            set +e
            env "$env_name=1" ./target/debug/sandbox >"$WORK/$name.log" 2>&1
            sandbox_status=$?
            set -e

            sleep 0.4
            kill -INT "$recorder_pid" 2>/dev/null || true
            wait "$recorder_pid" 2>/dev/null || true

            if [ "$sandbox_status" -ne 0 ]; then
              cat "$WORK/$name.log"
              echo "$name sandbox capture failed" >&2
              exit "$sandbox_status"
            fi

            test -s "$WORK/$name-raw.mp4"

            # Remove only the initial process/window-open black frames. Everything
            # after this point is footage produced by this exact current build.
            ffmpeg -hide_banner -loglevel error -y \
              -ss 0.8 -i "$WORK/$name-raw.mp4" \
              -an -vf "fps=30,scale=1280:720" \
              -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p \
              "$WORK/$name.mp4"
          }

          capture_demo progressive MICROLOGY_PROGRESSIVE_DAMAGE_DEMO 16
          capture_demo impact MICROLOGY_IMPACT_DEMO 18
          capture_demo fracture MICROLOGY_FRACTURE_DEMO 24
          capture_demo collapse MICROLOGY_COLLAPSE_DEMO 22

          card() {
            local name="$1"
            local duration="$2"
            local body="$3"
            printf '%s\n' "$body" > "$WORK/$name.txt"
            ffmpeg -hide_banner -loglevel error -y \
              -f lavfi -i "color=c=0x0d0e12:s=1280x720:r=30:d=$duration" \
              -vf "drawtext=fontfile=$FONT:textfile=$WORK/$name.txt:fontcolor=white:fontsize=44:line_spacing=14:x=(w-text_w)/2:y=(h-text_h)/2" \
              -an -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -r 30 \
              "$WORK/$name.mp4"
          }

          label_clip() {
            local src="$1"
            local dst="$2"
            local label="$3"
            printf '%s\n' "$label" > "$WORK/$dst-label.txt"
            ffmpeg -hide_banner -loglevel error -y \
              -i "$src" \
              -an \
              -vf "drawtext=fontfile=$FONT:textfile=$WORK/$dst-label.txt:fontcolor=white:fontsize=28:box=1:boxcolor=black@0.58:boxborderw=12:x=32:y=h-text_h-32,fps=30" \
              -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -r 30 \
              "$WORK/$dst.mp4"
          }

          label_clip "$WORK/progressive.mp4" progressive-labeled \
            "FRESH CURRENT BUILD — progressive damage"
          label_clip "$WORK/impact.mp4" impact-labeled \
            "FRESH CURRENT BUILD — native fragment impact + re-fracture"
          label_clip "$WORK/fracture.mp4" fracture-labeled \
            "FRESH CURRENT BUILD — persistent fracture / crack field"
          label_clip "$WORK/collapse.mp4" collapse-labeled \
            "FRESH CURRENT BUILD — material mechanics / structural collapse"

          card intro 4 $'MICROLOGY\nFRESH PROGRESS BUILD\nCaptured from the current engine — October 3, 2026'
          card destruction 4 $'THE DESTRUCTION STACK IS NOW REAL\nPersistent damage → cracks → native fragments → re-destruction\nSecondary contact damage and deterministic scheduling'
          card mechanics 4 $'MATERIAL MECHANICS\nSame geometry can behave differently by material\nPhysics participation remains optional for fantasy / impossible worlds'
          card chaos 5 $'LATEST ACCEPTANCE\nDROP 0005.8 participation matrix: 6 / 6\nDROP 0005.9 headless Chaos Pass: 24 / 24\n24 identical full-collapse replays'
          card editor 6 $'NOW STARTING: EDITOR FOUNDATION\nCanonical edit commands • stale-safe mutation\nExact undo / redo • bounded history\nBuilt on the same WorldEditBatch path — no second editor world'
          card boundary 4 $'NEXT VISUAL MILESTONE\nSelection • paint / carve / add • gizmos • editor / play mode\nWindows / NVIDIA interaction evidence comes when the desktop capture path is available'

          cat > "$WORK/concat.txt" <<EOF
          file '$WORK/intro.mp4'
          file '$WORK/destruction.mp4'
          file '$WORK/progressive-labeled.mp4'
          file '$WORK/impact-labeled.mp4'
          file '$WORK/fracture-labeled.mp4'
          file '$WORK/mechanics.mp4'
          file '$WORK/collapse-labeled.mp4'
          file '$WORK/chaos.mp4'
          file '$WORK/editor.mp4'
          file '$WORK/boundary.mp4'
          EOF

          ffmpeg -hide_banner -loglevel error -y \
            -f concat -safe 0 -i "$WORK/concat.txt" \
            -c copy -movflags +faststart \
            "$OUTDIR/Micrology_Fresh_Current_Build_2026-10-03.mp4"

          # Thumbnail uses a frame freshly captured from this build, not an old
          # diagnostic screenshot.
          ffmpeg -hide_banner -loglevel error -y \
            -ss 3 -i "$WORK/fracture.mp4" -frames:v 1 \
            -vf "drawtext=fontfile=$FONT:text='MICROLOGY — CURRENT BUILD':fontcolor=white:fontsize=50:box=1:boxcolor=black@0.62:boxborderw=18:x=(w-text_w)/2:y=44,drawtext=fontfile=$FONT:text='FRESH PROGRESS VIDEO':fontcolor=white:fontsize=44:box=1:boxcolor=black@0.62:boxborderw=16:x=(w-text_w)/2:y=h-text_h-44" \
            "$OUTDIR/Micrology_Fresh_Current_Build_2026-10-03_thumbnail.png"

          cp "$WORK/progressive.mp4" "$OUTDIR/fresh_progressive_damage.mp4"
          cp "$WORK/impact.mp4" "$OUTDIR/fresh_impact_refracture.mp4"
          cp "$WORK/fracture.mp4" "$OUTDIR/fresh_fracture_demo.mp4"
          cp "$WORK/collapse.mp4" "$OUTDIR/fresh_material_collapse.mp4"

          cat > "$OUTDIR/README.md" <<'EOF'
          # Fresh Micrology progress video — 2026-10-03

          Every gameplay/engine clip in this folder was freshly captured from the
          current build in the same workflow that rendered the final video.

          No previously committed MP4 footage was used in the final video.

          Capture environment: Linux Xvfb + Mesa lavapipe, for visual progress
          evidence only. These clips are not Windows/NVIDIA performance evidence.

          Fresh captures:
          - progressive damage
          - impact + native fragment re-fracture
          - persistent fracture/crack field
          - material-mechanics structural collapse

          The editor foundation currently has no visible UI; its milestone appears
          as a text card rather than fabricated gameplay footage.
          EOF

      - name: Commit fresh video and raw fresh captures
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostics/fresh_progress_video_2026_10_03
          git commit -m "video: fresh current-build Micrology progress capture [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
